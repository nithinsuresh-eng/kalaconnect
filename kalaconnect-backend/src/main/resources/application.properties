# ─── Database ───────────────────────────────────────────────────────────────

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kalaconnect?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ─── JPA / Hibernate ────────────────────────────────────────────────────────

# update = Hibernate automatically creates/updates tables and columns
# without deleting existing data
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the backend terminal
spring.jpa.show-sql=true

# Format SQL queries for easier reading
spring.jpa.properties.hibernate.format_sql=true

# MySQL database dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable Open Session in View
spring.jpa.open-in-view=false


# ─── Jackson JSON ────────────────────────────────────────────────────────────

# Prevent errors when serializing empty beans
spring.jackson.serialization.fail-on-empty-beans=false

# Do not include NULL fields in JSON responses
spring.jackson.default-property-inclusion=NON_NULL


# ─── Server ─────────────────────────────────────────────────────────────────

server.port=${PORT:8080}


# ─── JWT ────────────────────────────────────────────────────────────────────

kalaconnect.jwt.secret=${JWT_SECRET:KalaConnectSecretKey2024@SIH_FolkArtPlatform_India}
kalaconnect.jwt.expiration=86400000


# ─── Geo Matching ────────────────────────────────────────────────────────────

kalaconnect.geo.initial-radius-km=50
kalaconnect.geo.max-radius-km=300
kalaconnect.geo.radius-expansion-step-km=25


# ─── Twilio IVR ──────────────────────────────────────────────────────────────

# Replace these later with your actual Twilio credentials
twilio.account-sid=YOUR_TWILIO_ACCOUNT_SID
twilio.auth-token=YOUR_TWILIO_AUTH_TOKEN
twilio.phone-number=+1XXXXXXXXXX


# ─── Google Maps ─────────────────────────────────────────────────────────────

# Replace this later with your actual Google Maps API key
google.maps.api-key=YOUR_GOOGLE_MAPS_API_KEY


# ─── Logging ─────────────────────────────────────────────────────────────────

logging.level.com.kalaconnect=DEBUG
logging.level.org.springframework.web=INFO